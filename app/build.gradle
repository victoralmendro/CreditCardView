plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cooltechworks.checkoutflow'
    compileSdk 34        // ou 35 se já tiver instalado

    defaultConfig {
        applicationId "com.cooltechworks.checkoutflow"
        minSdk 21        // 19 até funciona, mas 21 simplifica
        targetSdk 34
        versionCode 2
        versionName "1.1"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':creditcarddesign')
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
